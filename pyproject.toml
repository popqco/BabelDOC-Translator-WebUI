[project]
name = "babeldoc-hardware-translator"
version = "1.1.0"
description = "BabelDOC 科技文档/芯片规格书批量双语翻译器（Gradio + pywebview 桌面应用）"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "popqco" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    # 运行时依赖以 requirements.lock 为准（完全锁定，可复现安装），
    # 此处仅声明直接依赖的下限约束供参考
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["venv", ".venv", "assets", "outputs", "video_frames", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
# app.py 必须在导入 ui/core 前先写好 NO_PROXY 环境变量；tests 需要先插入 sys.path
"app.py" = ["E402"]
"tests/*" = ["E402"]
