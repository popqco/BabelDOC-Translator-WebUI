name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 核心模块 (core/, tests/) 仅依赖标准库；pymupdf 供译文回退检测的
      # 回归测试使用。ruff 固定版本，避免新版规则导致 CI 与本地结果漂移
      - run: pip install pytest ruff==0.16.8 pymupdf
      - run: ruff check .
      - run: pytest -q
