name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 核心模块 (core/, tests/) 仅依赖标准库，CI 无需安装
      # BabelDOC/Gradio 全家桶；UI 冒烟由本地开发时手动执行
      - run: pip install pytest ruff
      - run: ruff check .
      - run: pytest -q
